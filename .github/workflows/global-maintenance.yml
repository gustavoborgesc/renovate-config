name: Global Repo Maintenance

on:
  schedule:
    - cron: '0 6 * * 1' # segunda-feira, 06:00 UTC
  workflow_dispatch:

# GITHUB_TOKEN só lê este repositório. PAT_GLOBAL fica no step que abre PRs.
permissions:
  contents: read

concurrency:
  group: global-repo-maintenance
  cancel-in-progress: false

jobs:
  maintain-repos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Recusar ref que não seja a branch padrão
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "Ref ${GITHUB_REF} não é a branch padrão. PAT_GLOBAL não será usado."
          exit 1

      - name: Checkout deste repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O script aplica o mesmo teto do preset: 2 PRs novos por hora,
      # 3 PRs abertos e 3 branches. Não escreve na branch padrão.
      - name: Abrir PRs com o preset central do Renovate
        env:
          GH_TOKEN: ${{ secrets.PAT_GLOBAL }}
          SELF_REPO: ${{ github.repository }}
        run: bash scripts/maintain-repos.sh
